<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="430" viewBox="0 0 1180 430">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4f5b66"/>
    </marker>
    <style>
      .box { fill: #f7f7f4; stroke: #8d969e; stroke-width: 1.4; }
      .stage { fill: #eaf2fb; stroke: #577fa8; stroke-width: 1.6; }
      .output { fill: #eef7ee; stroke: #6f9b6d; stroke-width: 1.4; }
      .eval { fill: #fff4e6; stroke: #b58a4a; stroke-width: 1.4; }
      .title { font: 600 17px "New Computer Modern", "Times New Roman", serif; fill: #1f2933; }
      .text { font: 14px "New Computer Modern", "Times New Roman", serif; fill: #33404a; }
      .line { stroke: #4f5b66; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="box" x="28" y="66" width="220" height="82" rx="6"/>
  <text class="title" x="138" y="96" text-anchor="middle">Numerical inputs</text>
  <text class="text" x="138" y="121" text-anchor="middle">Quant models, market data,</text>
  <text class="text" x="138" y="141" text-anchor="middle">macro signals</text>

  <rect class="box" x="28" y="222" width="220" height="82" rx="6"/>
  <text class="title" x="138" y="252" text-anchor="middle">Text-based inputs</text>
  <text class="text" x="138" y="277" text-anchor="middle">News and sentiment</text>
  <text class="text" x="138" y="297" text-anchor="middle">sources</text>

  <rect class="stage" x="315" y="144" width="210" height="82" rx="6"/>
  <text class="title" x="420" y="174" text-anchor="middle">Stage 1</text>
  <text class="text" x="420" y="199" text-anchor="middle">Evidence summary</text>

  <rect class="box" x="585" y="144" width="230" height="82" rx="6"/>
  <text class="title" x="700" y="174" text-anchor="middle">Structured overview</text>
  <text class="text" x="700" y="199" text-anchor="middle">Timestamped evidence</text>
  <text class="text" x="700" y="219" text-anchor="middle">summary</text>

  <rect class="stage" x="875" y="144" width="220" height="82" rx="6"/>
  <text class="title" x="985" y="174" text-anchor="middle">Stage 2</text>
  <text class="text" x="985" y="199" text-anchor="middle">LLM report generation</text>

  <rect class="output" x="875" y="28" width="220" height="82" rx="6"/>
  <text class="title" x="985" y="58" text-anchor="middle">Investment report</text>
  <text class="text" x="985" y="83" text-anchor="middle">Rationale, risks,</text>
  <text class="text" x="985" y="103" text-anchor="middle">scenarios</text>

  <rect class="output" x="875" y="260" width="220" height="82" rx="6"/>
  <text class="title" x="985" y="290" text-anchor="middle">Machine-readable</text>
  <text class="text" x="985" y="315" text-anchor="middle">Stock/bond weights</text>
  <text class="text" x="985" y="335" text-anchor="middle">and confidence</text>

  <rect class="eval" x="600" y="315" width="210" height="82" rx="6"/>
  <text class="title" x="705" y="345" text-anchor="middle">Evaluation</text>
  <text class="text" x="705" y="370" text-anchor="middle">Compare with 50/50</text>
  <text class="text" x="705" y="390" text-anchor="middle">and 60/40</text>

  <path class="line" d="M 248 107 C 274 107, 286 157, 315 173"/>
  <path class="line" d="M 248 263 C 274 263, 286 213, 315 197"/>
  <path class="line" d="M 525 185 L 585 185"/>
  <path class="line" d="M 815 185 L 875 185"/>
  <path class="line" d="M 985 144 L 985 110"/>
